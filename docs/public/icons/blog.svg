<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Newspaper sheet, matching the padlock body style -->
  <rect x="5" y="7" width="38" height="34" rx="4"
    fill="rgba(0,102,204,0.12)" stroke="#0066cc" stroke-width="2.5"/>
  <!-- Picture block -->
  <rect x="11" y="14" width="12" height="10" rx="1.5" fill="#0066cc"/>
  <!-- Text lines -->
  <line x1="28" y1="15" x2="37" y2="15" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="22" x2="37" y2="22" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11" y1="30" x2="37" y2="30" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11" y1="35" x2="30" y2="35" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round"/>
</svg>
