datex-ii:
  title: DATEX II
  longTitle: DATEX II data exchange specifications for traffic management and information
  icon: 🚦
  logo: /icons/standards/datex-ii.png
  description: European standard for traffic and travel information exchange
  domain: Road traffic and travel information
  purpose: Standard for exchanging road and traffic data such as incidents, roadworks, and traffic status between road authorities and service providers.
  format_technology: UML, XML, JSON, RDF (via DATEX II RDF profile)
  maintainer_origin: CEN (EN 16157, newer parts CEN/TS 16157)
  related_standards:
    - rds-tmc
    - mobilitydcat-ap
    - rdf
  status: European Standard (CEN), newer parts Technical Specifications
  link: https://docs.datex2.eu/

netex:
  title: NeTEx
  longTitle: Network Timetable Exchange
  icon: 🚇
  logo: /icons/standards/transmodel.png
  description: Network Timetable Exchange - public transport network data
  domain: Public transport (scheduled data)
  purpose: Data exchange standard for sharing public transport schedules, routes, stops, and fare information, based on the Transmodel conceptual model.
  format_technology: XML (W3C XML Schema)
  maintainer_origin: CEN (CEN/TS 16614)
  related_standards:
    - transmodel
    - siri
    - mobilitydcat-ap
  status: CEN Technical Specification
  link: https://transmodel-cen.eu/index.php/netex/

siri:
  title: SIRI
  longTitle: Service Interface for Real-time Information
  icon: 📡
  logo: /icons/standards/transmodel.png
  description: Service Interface for Real-time Information - live transit data
  domain: Public transport (real-time information)
  purpose: Defines interfaces for exchanging live operational data like vehicle positions, departures, and service alerts between systems.
  format_technology: XML, JSON
  maintainer_origin: CEN (EN 15531, parts 4 to 7 CEN/TS 15531)
  related_standards:
    - transmodel
    - netex
  status: European Standard (CEN), later parts Technical Specifications
  link: https://transmodel-cen.eu/index.php/siri/

mobilitydcat-ap:
  title: mobilityDCAT-AP
  longTitle: A mobility extension for the DCAT application profile for data portals in Europe
  icon: 🏷️
  logo: /icons/standards/mobilitydcat-ap.png
  description: Mobility extension of DCAT-AP - metadata for mobility data portals
  domain: Transport and mobility data catalogues
  purpose: Extension of DCAT-AP tailored for describing datasets and APIs in National Access Points (NAPs) for mobility data.
  format_technology: RDF, DCAT vocabulary
  maintainer_origin: NAPCORE (Task 4.4, Metadata Working Group)
  related_standards:
    - dcat-ap
    - datex-ii
    - netex
    - gtfs
    - shacl
  status: NAPCORE Recommendation
  link: https://w3id.org/mobilitydcat-ap/

dcat-ap:
  title: DCAT-AP
  longTitle: DCAT Application Profile for data portals in Europe
  icon: 📋
  logo: /icons/standards/dcat-ap.png
  description: Data Catalog Application Profile - EU open data metadata
  domain: Open data and metadata cataloguing
  purpose: Common model for describing datasets, APIs, and catalogues to enable interoperability among European open data portals.
  format_technology: RDF, W3C DCAT vocabulary
  maintainer_origin: European Commission (SEMIC)
  related_standards:
    - mobilitydcat-ap
    - rdf
    - shacl
  status: EU application profile of the W3C DCAT vocabulary
  link: https://op.europa.eu/en/web/eu-vocabularies/dcat-ap

rds-tmc:
  title: RDS-TMC (ISO 14819)
  longTitle: Radio Data System – Traffic Message Channel
  icon: 📻
  logo: /icons/standards/tmc.svg
  description: Traffic messages over FM radio, coded with ALERT-C
  domain: Road traffic information broadcasting
  purpose: Encodes traffic messages into FM radio broadcasts to deliver real-time traffic updates to navigation systems. ISO 14819 defines the ALERT-C coding protocol, the event list, and the location referencing.
  format_technology: Binary over FM RDS
  maintainer_origin: ISO/TC 204
  related_standards:
    - datex-ii
  status: ISO standard, adopted in Europe as EN ISO 14819
  link: https://www.iso.org/standard/76781.html

gtfs:
  title: GTFS
  longTitle: General Transit Feed Specification
  icon: 🚌
  logo: /icons/standards/gtfs.png
  description: General Transit Feed Specification
  domain: Public transport (static data)
  purpose: Open format for publishing scheduled public transport data including routes, stops, and timetables.
  format_technology: CSV (zipped feed)
  maintainer_origin: Originally Google; now MobilityData community
  related_standards:
    - gtfs-realtime
    - mobilitydcat-ap
  status: Widely adopted global community standard
  link: https://gtfs.org/

gtfs-realtime:
  title: GTFS Realtime
  longTitle: General Transit Feed Specification Realtime
  icon: ⚡
  logo: /icons/standards/gtfs.png
  description: Real-time transit updates extension for GTFS
  domain: Public transport (real-time data)
  purpose: Real-time extension of GTFS providing live updates on vehicle positions, trip progress, and service alerts.
  format_technology: Protocol Buffers (protobuf)
  maintainer_origin: MobilityData community
  related_standards:
    - gtfs
  status: Community specification (MobilityData)
  link: https://gtfs.org/documentation/realtime/reference/

gbfs:
  title: GBFS
  longTitle: General Bikeshare Feed Specification
  icon: 🚲
  logo: /icons/standards/gbfs.png
  description: General Bikeshare Feed Specification - standard for shared mobility systems
  domain: Micromobility and shared mobility
  purpose: Defines a standard format for sharing real-time data about shared vehicles (bikes, scooters, etc.).
  format_technology: JSON (REST API)
  maintainer_origin: MobilityData community
  related_standards:
    - mobilitydcat-ap
    - gtfs
  status: Community specification (MobilityData)
  link: https://gbfs.org/

transmodel:
  title: Transmodel
  longTitle: European Reference Data Model for Public Transport
  icon: 🗺️
  logo: /icons/standards/transmodel.png
  description: European reference data model for public transport
  domain: Public transport conceptual modelling
  purpose: Conceptual data model describing the structure and relationships of public transport information (network, timetables, operations).
  format_technology: UML conceptual model
  maintainer_origin: CEN (EN 12896)
  related_standards:
    - netex
    - siri
  status: EU standard (CEN)
  link: https://transmodel-cen.eu/

rdf:
  title: RDF
  longTitle: Resource Description Framework
  icon: 🔗
  logo: /icons/standards/rdf.svg
  description: Resource Description Framework - W3C standard for linked data and semantic web
  domain: Semantic web and linked data
  purpose: Framework for representing and linking structured data across the web, foundational to DCAT and mobilityDCAT-AP.
  format_technology: RDF/XML, Turtle, JSON-LD
  maintainer_origin: W3C
  related_standards:
    - dcat-ap
    - mobilitydcat-ap
    - shacl
  status: W3C core standard
  link: https://www.w3.org/RDF/

shacl:
  title: SHACL
  longTitle: Shapes Constraint Language
  icon: 🔷
  logo: /icons/standards/shacl.svg
  description: Shapes Constraint Language - W3C standard for validating RDF graphs
  domain: Semantic web and linked data (validation)
  purpose: W3C language for describing and validating RDF graphs against a set of conditions (shapes), commonly used to check DCAT-AP and mobilityDCAT-AP metadata for conformance.
  format_technology: RDF (Turtle, RDF/XML, JSON-LD)
  maintainer_origin: W3C
  related_standards:
    - rdf
    - dcat-ap
    - mobilitydcat-ap
  status: W3C standard (Recommendation)
  link: https://www.w3.org/TR/shacl/

osm:
  title: OSM
  longTitle: OpenStreetMap
  icon: 🌍
  logo: /icons/standards/osm.svg
  description: OpenStreetMap - collaborative open-source mapping data
  domain: Geospatial and transport mapping
  purpose: Collaborative open geodata project providing maps, networks, and location references widely used in transport applications.
  format_technology: XML, PBF (binary), APIs
  maintainer_origin: OpenStreetMap Foundation / global community
  related_standards:
    - gtfs
    - datex-ii
  status: Global open dataset / de facto reference
  link: https://www.openstreetmap.org/
